[project]
name = "retract"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.69",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "psycopg[binary]>=3.3.4",
    "uvicorn>=0.52.1",
]

# sentence-transformers pulls torch: ~2GB and several minutes of build time.
# The deployed demo runs on Bedrock, so the container does not need it. Anyone
# cloning without an AWS account does:  uv sync --extra local
[project.optional-dependencies]
local = ["sentence-transformers>=5.7.0"]
